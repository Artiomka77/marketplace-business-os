name: fin-accept-images-build-only

# BUILD/TEST ONLY — no deploy, no SSH/SCP to MAIN, no production DB.
on:
  push:
    branches:
      - "build/fin-accept-images-20261027_R11"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fin-accept-images-build-only-20261027_R11
  cancel-in-progress: true

jobs:
  build-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finaccept
          POSTGRES_PASSWORD: finaccept
          POSTGRES_DB: finaccept
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finaccept -d finaccept"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FINANCIAL_SOURCE_COMMIT: bf4f8b5690bdbe417afe7a95cc7beca16c043abc
      STAMP: "20261027_R11"
      EXPECT_STOCK_ABC_SHA256: "982bab4f3d0b4e790fc889e7fa3c14dfc116345c4472310e97479cf7166db191"
      NEXT_PUBLIC_SITE_URL: http://72.56.4.62
      NEXT_PUBLIC_SUPABASE_URL: https://rezhzulsjtcvxqofhlyl.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_C_GNkiB2FEemxEYd1VTtTA_hRLfSupT
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_C_GNkiB2FEemxEYd1VTtTA_hRLfSupT
      # Job service publishes 5432 on the runner; smoke containers use host network.
      SMOKE_DATABASE_URL: postgresql://finaccept:finaccept@127.0.0.1:5432/finaccept
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove GitHub-hosted runner
        run: |
          set -euo pipefail
          {
            echo "RUNNER_GITHUB_HOSTED=YES"
            echo "RUNNER_SELF_HOSTED=NO"
            echo "ImageOS=${ImageOS:-}"
            echo "RUNNER_NAME=${RUNNER_NAME:-}"
            echo "RUNNER_OS=${RUNNER_OS:-}"
            echo "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-}"
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "FINANCIAL_SOURCE_COMMIT=${FINANCIAL_SOURCE_COMMIT}"
            hostname
            uname -a
          } | tee runner-proof.txt
          test "${RUNNER_ENVIRONMENT:-}" != "self-hosted"
          test -n "${ImageOS:-}"

      - name: Fail-closed source gates
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f Dockerfile.workers
          test -f package.json
          test -f package-lock.json
          test -f next.config.ts
          grep -q 'output: "standalone"' next.config.ts
          test -f scripts/dashboard/runProfitReadModelWorker.ts
          test -f scripts/dashboard/runV6PeriodReadModelWorker.ts
          test -f scripts/dashboard/runDashboardPeriodSnapshotWorker.ts
          test -f lib/dashboard/periodSnapshot.ts
          test -f lib/stocks/stockAbcSnapshots.ts
          test -f lib/analytics/profitAnalytics.ts
          test -f lib/analytics/profitAnalyticsOzon.ts
          test -f lib/finance/effectiveFinanceTransactions.ts
          test -f financial-core/v6/manifest.json
          test ! -f Dockerfile.dockerignore
          if grep -n 'COPY overlays/fin-accept/stockAbcSnapshots' Dockerfile.workers; then
            echo "FORBIDDEN: post-verify stockAbc overlay still present" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$FINANCIAL_SOURCE_COMMIT" HEAD
          echo "financial_ancestor_ok" | tee financial-ancestor.txt
          node -e "
            const fs=require('fs'); const crypto=require('crypto');
            const b=fs.readFileSync('lib/stocks/stockAbcSnapshots.ts');
            const h=crypto.createHash('sha256').update(b).digest('hex');
            const man=JSON.parse(fs.readFileSync('financial-core/v6/manifest.json','utf8'));
            const e=man.protectedFiles.find(f=>f.path==='lib/stocks/stockAbcSnapshots.ts');
            if(!e) throw new Error('manifest missing stockAbc');
            if(h!==process.env.EXPECT_STOCK_ABC_SHA256) throw new Error('tree hash mismatch '+h);
            if(e.activeSha256!==h || e.snapshotSha256!==h) throw new Error('manifest hash drift');
            const snap=fs.readFileSync('financial-core/v6/snapshot/lib/stocks/stockAbcSnapshots.ts');
            const hs=crypto.createHash('sha256').update(snap).digest('hex');
            if(hs!==h) throw new Error('snapshot!=active');
            console.log('STOCK_ABC_HASH_OK', h);
          "

      - name: Set image tags
        id: tags
        run: |
          set -euo pipefail
          echo "app=avorofin-p0-cogs-app:fin_accept_${STAMP}" >> "$GITHUB_OUTPUT"
          echo "profit=avorofin-p0-cogs-profit:fin_accept_${STAMP}" >> "$GITHUB_OUTPUT"
          echo "v6=avorofin-p0-cogs-v6:fin_accept_${STAMP}" >> "$GITHUB_OUTPUT"
          echo "dashboard=avorofin-p0-cogs-dashboard:fin_accept_${STAMP}" >> "$GITHUB_OUTPUT"
          echo "stock=avorofin-p0-cogs-stock:fin_accept_${STAMP}" >> "$GITHUB_OUTPUT"

      - name: Build APP standalone image
        run: |
          set -euo pipefail
          docker build --progress=plain \
            --target runner \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --label "avorofin.fin_accept=1" \
            --label "avorofin.runtime=app" \
            --label "avorofin.financialSourceCommit=${FINANCIAL_SOURCE_COMMIT}" \
            --label "avorofin.buildSourceCommit=${GITHUB_SHA}" \
            -t "${{ steps.tags.outputs.app }}" \
            -f Dockerfile \
            . 2>&1 | tee DOCKER_BUILD_APP.txt

      - name: Build worker images (profit/v6/dashboard/stock)
        run: |
          set -euo pipefail
          common=(
            --progress=plain
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}"
            --build-arg "FINANCIAL_SOURCE_COMMIT=${FINANCIAL_SOURCE_COMMIT}"
            --label "avorofin.fin_accept=1"
            --label "avorofin.financialSourceCommit=${FINANCIAL_SOURCE_COMMIT}"
            --label "avorofin.buildSourceCommit=${GITHUB_SHA}"
            -f Dockerfile.workers
          )
          docker build --target profit "${common[@]}" -t "${{ steps.tags.outputs.profit }}" . 2>&1 | tee DOCKER_BUILD_PROFIT.txt
          docker build --target v6 "${common[@]}" -t "${{ steps.tags.outputs.v6 }}" . 2>&1 | tee DOCKER_BUILD_V6.txt
          docker build --target dashboard "${common[@]}" -t "${{ steps.tags.outputs.dashboard }}" . 2>&1 | tee DOCKER_BUILD_DASHBOARD.txt
          docker build --target stock "${common[@]}" -t "${{ steps.tags.outputs.stock }}" . 2>&1 | tee DOCKER_BUILD_STOCK.txt

      - name: Inspect + protected hash + offline imports
        run: |
          set -euo pipefail
          mkdir -p image-meta smoke-logs
          for pair in \
            "app|${{ steps.tags.outputs.app }}" \
            "profit|${{ steps.tags.outputs.profit }}" \
            "v6|${{ steps.tags.outputs.v6 }}" \
            "dashboard|${{ steps.tags.outputs.dashboard }}" \
            "stock|${{ steps.tags.outputs.stock }}"
          do
            role="${pair%%|*}"
            tag="${pair##*|}"
            docker image inspect "$tag" > "image-meta/${role}.inspect.json"
            docker image inspect -f '{{.Id}}' "$tag" | tee "image-meta/${role}.ImageId.txt"
            docker image inspect -f '{{json .RepoDigests}}' "$tag" | tee "image-meta/${role}.RepoDigests.json"
            docker image inspect -f '{{.Os}}/{{.Architecture}}' "$tag" | tee "image-meta/${role}.platform.txt"
            docker image inspect -f '{{json .Config.Cmd}}' "$tag" | tee "image-meta/${role}.Cmd.json"
            docker image inspect -f '{{json .Config.Entrypoint}}' "$tag" | tee "image-meta/${role}.Entrypoint.json"
            docker image inspect -f '{{json .Config.User}}' "$tag" | tee "image-meta/${role}.User.json"
            echo "$tag" > "image-meta/${role}.tag.txt"
          done

          docker run --rm --entrypoint node "${{ steps.tags.outputs.app }}" -e \
            "const fs=require('fs'); fs.accessSync('server.js'); console.log('APP_SERVER_JS_OK')"

          for tag in \
            "${{ steps.tags.outputs.profit }}" \
            "${{ steps.tags.outputs.v6 }}" \
            "${{ steps.tags.outputs.dashboard }}" \
            "${{ steps.tags.outputs.stock }}"
          do
            docker run --rm --user node \
              -e "EXPECT_STOCK_ABC_SHA256=${EXPECT_STOCK_ABC_SHA256}" \
              --entrypoint node "$tag" --input-type=module --import tsx -e "
              import { createRequire } from 'node:module';
              import fs from 'node:fs';
              import crypto from 'node:crypto';
              const require = createRequire(import.meta.url);
              require.resolve('tsx');
              require.resolve('@prisma/client');
              require.resolve('@prisma/adapter-pg');
              require.resolve('pg');
              const a = await import('./lib/analytics/profitAnalytics.ts');
              const o = await import('./lib/analytics/profitAnalyticsOzon.ts');
              const f = await import('./lib/finance/effectiveFinanceTransactions.ts');
              const s = await import('./lib/stocks/stockAbcSnapshots.ts');
              await import('./lib/dashboard/periodSnapshot.ts');
              if (typeof a.getProfitAnalytics !== 'function') throw new Error('missing getProfitAnalytics');
              if (typeof o.getProfitAnalyticsOzon !== 'function') throw new Error('missing getProfitAnalyticsOzon');
              if (typeof f.getEffectiveFinanceTransactions !== 'function') throw new Error('missing getEffectiveFinanceTransactions');
              if (typeof s.prepareStockAbcSnapshot !== 'function') throw new Error('missing prepareStockAbcSnapshot');
              if (typeof s.persistPreparedStockAbcSnapshot !== 'function') throw new Error('missing persistPreparedStockAbcSnapshot');
              const buf = fs.readFileSync('lib/stocks/stockAbcSnapshots.ts');
              const h = crypto.createHash('sha256').update(buf).digest('hex');
              if (h !== process.env.EXPECT_STOCK_ABC_SHA256) throw new Error('image stockAbc hash '+h);
              console.log('WORKER_OFFLINE_IMPORT_AND_HASH_OK', h);
            "
          done

          docker image inspect -f '{{json .Config.Cmd}}' "${{ steps.tags.outputs.profit }}" | grep -q runProfitReadModelWorker.ts
          docker image inspect -f '{{json .Config.Cmd}}' "${{ steps.tags.outputs.v6 }}" | grep -q runV6PeriodReadModelWorker.ts
          docker image inspect -f '{{json .Config.Cmd}}' "${{ steps.tags.outputs.dashboard }}" | grep -q runDashboardPeriodSnapshotWorker.ts
          docker image inspect -f '{{json .Config.Cmd}}' "${{ steps.tags.outputs.stock }}" | grep -q runDashboardPeriodSnapshotWorker.ts

      - name: Real entrypoint smoke (isolated DB, no prod)
        run: |
          set -euo pipefail
          mkdir -p smoke-logs

          # APP: real server.js as image Config.User; isolated DB on host-published service port.
          APP_USER=$(docker image inspect -f '{{.Config.User}}' "${{ steps.tags.outputs.app }}")
          APP_USER_ARGS=()
          if [ -n "$APP_USER" ]; then APP_USER_ARGS=(--user "$APP_USER"); fi
          docker run -d --name fa-smoke-app --network host \
            "${APP_USER_ARGS[@]}" \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e NODE_ENV=production \
            "${{ steps.tags.outputs.app }}"
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            echo "try=$i code=$code" | tee -a smoke-logs/app_login.txt
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs fa-smoke-app > smoke-logs/app_server.log 2>&1 || true
          docker stop fa-smoke-app >/dev/null || true
          docker rm fa-smoke-app >/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "APP /login smoke failed" >&2
            exit 1
          fi
          echo "APP_LOGIN_SMOKE_OK user=${APP_USER:-empty}" | tee smoke-logs/app_login_result.txt

          # Schema for isolated smoke DB (no production). Prefer db push from worker image.
          # Prisma 7: pass --url (no --skip-generate on db push).
          docker run --rm --network host --user root \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            --entrypoint npx "${{ steps.tags.outputs.profit }}" \
            prisma db push --accept-data-loss --url "$SMOKE_DATABASE_URL" \
            > smoke-logs/prisma_db_push.txt 2>&1 || {
              echo "prisma db push failed" >&2
              cat smoke-logs/prisma_db_push.txt >&2 || true
              exit 1
            }
          echo "PRISMA_DB_PUSH_OK" | tee smoke-logs/prisma_db_push_result.txt

          require_marker() {
            local role="$1" marker="$2"
            if ! grep -F "$marker" "smoke-logs/${role}_stdout.txt" "smoke-logs/${role}_stderr.txt" >/dev/null 2>&1; then
              echo "${role}_MISSING_MARKER $marker" >&2
              cat "smoke-logs/${role}_stdout.txt" >&2 || true
              cat "smoke-logs/${role}_stderr.txt" >&2 || true
              return 1
            fi
            echo "${role}_MARKER_OK $marker" | tee -a smoke-logs/worker_exits.txt
          }

          # Profit: real MODE from entrypoint. Timeout/idle alone do not pass.
          PROFIT_USER=$(docker image inspect -f '{{.Config.User}}' "${{ steps.tags.outputs.profit }}")
          PROFIT_USER_ARGS=()
          if [ -n "$PROFIT_USER" ]; then PROFIT_USER_ARGS=(--user "$PROFIT_USER"); fi
          set +e
          timeout 90s docker run --rm --network host "${PROFIT_USER_ARGS[@]}" \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e NODE_ENV=production \
            -e WAVE_B_PROFIT_WORKER_MODE=queue-once \
            -e WAVE_B_PROFIT_WORKER_MAX_JOBS=1 \
            "${{ steps.tags.outputs.profit }}" \
            > smoke-logs/profit_stdout.txt 2> smoke-logs/profit_stderr.txt
          profit_ec=$?
          set -e
          echo "profit_exit=$profit_ec user=${PROFIT_USER:-empty}" | tee -a smoke-logs/worker_exits.txt
          if [ "$profit_ec" -eq 124 ]; then echo "profit_TIMEOUT_NOT_ACCEPTABLE" >&2; exit 1; fi
          require_marker profit 'wave_b_profit_worker_start'
          require_marker profit '"mode":"queue-once"'

          # V6: oneshot + target URL (required by entrypoint).
          V6_USER=$(docker image inspect -f '{{.Config.User}}' "${{ steps.tags.outputs.v6 }}")
          V6_USER_ARGS=()
          if [ -n "$V6_USER" ]; then V6_USER_ARGS=(--user "$V6_USER"); fi
          set +e
          timeout 120s docker run --rm --network host "${V6_USER_ARGS[@]}" \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e V6_READMODEL_TARGET_DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e V6_READMODEL_WORKER_MODE=oneshot \
            -e V6_READMODEL_DATE_FROM=2026-10-19 \
            -e V6_READMODEL_DATE_TO=2026-10-25 \
            -e NODE_ENV=production \
            "${{ steps.tags.outputs.v6 }}" \
            > smoke-logs/v6_stdout.txt 2> smoke-logs/v6_stderr.txt
          v6_ec=$?
          set -e
          echo "v6_exit=$v6_ec user=${V6_USER:-empty}" | tee -a smoke-logs/worker_exits.txt
          if [ "$v6_ec" -eq 124 ]; then echo "v6_TIMEOUT_NOT_ACCEPTABLE" >&2; exit 1; fi
          require_marker v6 'v6_period_readmodel_worker_start'
          # Isolated empty DB: oneshot must run and either complete or fail-closed
          # (D6_UNSAFE_NO_WB_EVENTS). Timeout/idle alone are not accepted.
          if grep -F 'v6_period_readmodel_worker_done' smoke-logs/v6_stdout.txt smoke-logs/v6_stderr.txt >/dev/null 2>&1; then
            echo 'v6_MARKER_OK v6_period_readmodel_worker_done' | tee -a smoke-logs/worker_exits.txt
          elif grep -F 'D1D5_V2_BUILD_FORBIDDEN:D6_UNSAFE_NO_WB_INTERVALS' smoke-logs/v6_stdout.txt smoke-logs/v6_stderr.txt >/dev/null 2>&1; then
            echo 'v6_MARKER_OK controlled_fail_closed_oneshot_exact_D6_UNSAFE_NO_WB_INTERVALS' | tee -a smoke-logs/worker_exits.txt
            [[ "$v6_ec" -ne 0 ]] || { echo 'v6_NEGATIVE_EXPECTED_NONZERO' >&2; exit 1; }
          else
            echo 'v6_MISSING_EXACT_FAIL_CLOSED_REASON' >&2
            cat smoke-logs/v6_stdout.txt >&2 || true
            cat smoke-logs/v6_stderr.txt >&2 || true
            exit 1
          fi

          smoke_dashboard_once() {
            local role="$1" tag="$2" formulas="$3"
            local cfg_user user_flag=()
            cfg_user=$(docker image inspect -f '{{.Config.User}}' "$tag")
            if [ -n "$cfg_user" ]; then user_flag=(--user "$cfg_user"); fi
            set +e
            timeout 90s docker run --rm --network host "${user_flag[@]}" \
              -e DATABASE_URL="$SMOKE_DATABASE_URL" \
              -e NODE_ENV=production \
              -e DASHBOARD_SNAPSHOT_WORKER_MODE=once \
              -e DASHBOARD_SNAPSHOT_FORMULA_VERSIONS="$formulas" \
              "$tag" > "smoke-logs/${role}_stdout.txt" 2> "smoke-logs/${role}_stderr.txt"
            local ec=$?
            set -e
            echo "${role}_exit=$ec user=${cfg_user:-empty}" | tee -a smoke-logs/worker_exits.txt
            if [ "$ec" -eq 124 ]; then echo "${role}_TIMEOUT_NOT_ACCEPTABLE" >&2; return 1; fi
            require_marker "$role" 'WORKER_START'
            require_marker "$role" 'WORKER_STOPPED'
          }

          smoke_dashboard_once dashboard "${{ steps.tags.outputs.dashboard }}" "FINANCIAL_CORE_V4_PERIOD_SNAPSHOT_V1"
          smoke_dashboard_once stock "${{ steps.tags.outputs.stock }}" "STOCK_PLANNING_SNAPSHOT_V3"
          echo "ALL_WORKER_ENTRYPOINT_SMOKE_OK" | tee smoke-logs/workers_result.txt

      - name: Install psql for controlled jobs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Controlled jobs on freshly built images
        run: |
          set -euo pipefail
          mkdir -p job-logs
          # Truncate leftover smoke DB job noise; re-push schema already done
          psql "$SMOKE_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/fin_accept/seed_controlled_jobs.sql | tee job-logs/seed.txt

          run_profit() {
            set +e
            timeout 180s docker run --rm --network host --user 0 \
              -e DATABASE_URL="$SMOKE_DATABASE_URL" -e NODE_ENV=production \
              -e WAVE_B_PROFIT_WORKER_MODE=queue-once -e WAVE_B_PROFIT_WORKER_MAX_JOBS=2 \
              "${{ steps.tags.outputs.profit }}" \
              > job-logs/profit_job_stdout.txt 2> job-logs/profit_job_stderr.txt
            echo "profit_job_exit=$?" | tee -a job-logs/assertions.txt
            set -e
            grep -F 'wave_b_profit_job_success' job-logs/profit_job_stdout.txt
            wb=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT status FROM \"DashboardPeriodSnapshotJob\" WHERE id='job-profit-wb-r09'")
            oz=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT status FROM \"DashboardPeriodSnapshotJob\" WHERE id='job-profit-ozon-r09'")
            [[ "$wb" == "SUCCESS" && "$oz" == "SUCCESS" ]]
            echo "PROFIT_CONTROLLED_JOB_OK" | tee -a job-logs/assertions.txt
          }
          run_dash() {
            set +e
            timeout 180s docker run --rm --network host --user 0 \
              -e DATABASE_URL="$SMOKE_DATABASE_URL" -e NODE_ENV=production \
              -e DASHBOARD_SNAPSHOT_WORKER_MODE=once \
              -e DASHBOARD_SNAPSHOT_FORMULA_VERSIONS=FINANCIAL_CORE_V4_PERIOD_SNAPSHOT_V1 \
              "${{ steps.tags.outputs.dashboard }}" \
              > job-logs/dash_job_stdout.txt 2> job-logs/dash_job_stderr.txt
            echo "dash_job_exit=$?" | tee -a job-logs/assertions.txt
            set -e
            grep -F 'SNAPSHOT_JOB_SUCCESS' job-logs/dash_job_stdout.txt
            st=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT status FROM \"DashboardPeriodSnapshotJob\" WHERE id='job-dash-v4-r09'")
            [[ "$st" == "SUCCESS" ]]
            echo "DASHBOARD_CONTROLLED_JOB_OK" | tee -a job-logs/assertions.txt
          }
          run_stock() {
            set +e
            timeout 240s docker run --rm --network host --user 0 \
              -e DATABASE_URL="$SMOKE_DATABASE_URL" -e NODE_ENV=production \
              -e DASHBOARD_SNAPSHOT_WORKER_MODE=once \
              -e DASHBOARD_SNAPSHOT_FORMULA_VERSIONS=STOCK_PLANNING_SNAPSHOT_V3 \
              "${{ steps.tags.outputs.stock }}" \
              > job-logs/stock_job_stdout.txt 2> job-logs/stock_job_stderr.txt
            echo "stock_job_exit=$?" | tee -a job-logs/assertions.txt
            set -e
            st=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT status FROM \"DashboardPeriodSnapshotJob\" WHERE id='job-stock-r09'")
            if grep -F 'STOCK_PLANNING_JOB_SUCCESS' job-logs/stock_job_stdout.txt && [[ "$st" == "SUCCESS" ]]; then
              snaps=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT COUNT(*) FROM \"StockAbcSnapshot\" WHERE \"companyScope\"='ИП Петров'")
              [[ "$snaps" -ge 1 ]]
              echo "STOCK_CONTROLLED_JOB_OK snaps=$snaps" | tee -a job-logs/assertions.txt
            else
              err=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT COALESCE(\"lastError\",'') FROM \"DashboardPeriodSnapshotJob\" WHERE id='job-stock-r09'")
              echo "STOCK_JOB_STATUS=$st err=${err:0:240}" | tee -a job-logs/assertions.txt
              cat job-logs/stock_job_stdout.txt
              cat job-logs/stock_job_stderr.txt
              grep -E 'SNAPSHOT_JOB_STARTED|SNAPSHOT_JOB_ERROR|STOCK_PLANNING_JOB_SUCCESS' job-logs/stock_job_stdout.txt
              exit 1
            fi
          }
          run_v6_pos() {
            # 1) Positive oneshot on seeded WB ownership (produceV6 path).
            set +e
            timeout 240s docker run --rm --network host --user 0 \
              -e DATABASE_URL="$SMOKE_DATABASE_URL" \
              -e V6_READMODEL_TARGET_DATABASE_URL="$SMOKE_DATABASE_URL" \
              -e V6_READMODEL_WORKER_MODE=oneshot \
              -e V6_READMODEL_DATE_FROM=2026-10-19 \
              -e V6_READMODEL_DATE_TO=2026-10-25 \
              -e V6_READMODEL_COMPANY_SCOPE="ИП Петров" \
              -e NODE_ENV=production \
              "${{ steps.tags.outputs.v6 }}" \
              > job-logs/v6_pos_oneshot_stdout.txt 2> job-logs/v6_pos_oneshot_stderr.txt
            echo "v6_pos_oneshot_exit=$?" | tee -a job-logs/assertions.txt
            set -e
            grep -F 'v6_period_readmodel_worker_done' job-logs/v6_pos_oneshot_stdout.txt \
              || { echo 'V6_POSITIVE_ONESHOT_MISSING_DONE'; cat job-logs/v6_pos_oneshot_stdout.txt; cat job-logs/v6_pos_oneshot_stderr.txt; exit 1; }
            # 2) Real queue claim/process of seeded job (same produce path).
            psql "$SMOKE_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
              "UPDATE \"DashboardPeriodSnapshotJob\" SET status='PENDING', attempts=0, \"lockedAt\"=NULL, \"lockedBy\"=NULL, \"lastError\"=NULL, \"finishedAt\"=NULL, \"nextAttemptAt\"=NULL, \"updatedAt\"=NOW() WHERE id='job-v6-r09';"
            psql "$SMOKE_DATABASE_URL" -c \
              "SELECT id, status, \"formulaVersion\", \"companyScope\" FROM \"DashboardPeriodSnapshotJob\" WHERE id='job-v6-r09';" \
              | tee -a job-logs/assertions.txt
            set +e
            timeout 240s docker run --rm --network host --user 0 \
              -e DATABASE_URL="$SMOKE_DATABASE_URL" \
              -e V6_READMODEL_TARGET_DATABASE_URL="$SMOKE_DATABASE_URL" \
              -e V6_READMODEL_WORKER_MODE=queue-once \
              -e V6_READMODEL_WORKER_MAX_JOBS=1 \
              -e NODE_ENV=production \
              "${{ steps.tags.outputs.v6 }}" \
              > job-logs/v6_pos_stdout.txt 2> job-logs/v6_pos_stderr.txt
            echo "v6_pos_queue_exit=$?" | tee -a job-logs/assertions.txt
            set -e
            cat job-logs/v6_pos_stdout.txt | tee -a job-logs/assertions.txt || true
            cat job-logs/v6_pos_stderr.txt | tee -a job-logs/assertions.txt || true
            st=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT status FROM \"DashboardPeriodSnapshotJob\" WHERE id='job-v6-r09'")
            err=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT COALESCE(\"lastError\",'') FROM \"DashboardPeriodSnapshotJob\" WHERE id='job-v6-r09'")
            echo "v6_job_status=$st err=${err:0:300}" | tee -a job-logs/assertions.txt
            [[ "$st" == "SUCCESS" ]] || exit 1
            # V6 persists PeriodCompanyMarketplaceMetric / DailyCompanyMarketplaceMetric (not DashboardPeriodSnapshot).
            period_rows=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT COUNT(*) FROM \"PeriodCompanyMarketplaceMetric\" WHERE \"formulaVersion\"='FINANCIAL_CORE_V6_PERIOD_READMODEL_V2'")
            daily_rows=$(psql "$SMOKE_DATABASE_URL" -Atc "SELECT COUNT(*) FROM \"DailyCompanyMarketplaceMetric\" WHERE \"formulaVersion\"='FINANCIAL_CORE_V6_PERIOD_READMODEL_V2'")
            echo "v6_period_rows=$period_rows daily_rows=$daily_rows" | tee -a job-logs/assertions.txt
            [[ "$period_rows" -ge 1 ]]
            [[ "$daily_rows" -ge 1 ]]
            echo "V6_POSITIVE_CONTROLLED_JOB_OK period=$period_rows daily=$daily_rows" | tee -a job-logs/assertions.txt
          }
          run_profit
          run_dash
          run_stock
          run_v6_pos
          echo "ALL_CONTROLLED_JOBS_OK" | tee job-logs/controlled_jobs_result.txt

      - name: docker save + sha256 artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p image-tarballs
          summarize=image-meta/ARTIFACTS_MANIFEST.json
          echo '{' > "$summarize.tmp"
          first=1
          for pair in \
            "app|${{ steps.tags.outputs.app }}" \
            "profit|${{ steps.tags.outputs.profit }}" \
            "v6|${{ steps.tags.outputs.v6 }}" \
            "dashboard|${{ steps.tags.outputs.dashboard }}" \
            "stock|${{ steps.tags.outputs.stock }}"
          do
            role="${pair%%|*}"
            tag="${pair##*|}"
            out="image-tarballs/${role}.tar.gz"
            docker save "$tag" | gzip -c > "$out"
            sha=$(sha256sum "$out" | awk '{print $1}')
            size=$(wc -c < "$out" | tr -d ' ')
            id=$(cat "image-meta/${role}.ImageId.txt")
            platform=$(cat "image-meta/${role}.platform.txt")
            echo "$sha  ${role}.tar.gz" >> image-tarballs/SHA256SUMS.txt
            if [ "$first" -eq 0 ]; then echo ',' >> "$summarize.tmp"; fi
            first=0
            printf '"%s":{"tag":"%s","ImageId":"%s","tarSha256":"%s","tarBytes":%s,"platform":"%s","RepoDigest":null,"RepoDigestStatus":"NOT_PUSHED_TO_REGISTRY"}' \
              "$role" "$tag" "$id" "$sha" "$size" "$platform" >> "$summarize.tmp"
          done
          echo '}' >> "$summarize.tmp"
          mv "$summarize.tmp" "$summarize"
          {
            echo "financialSourceCommit=${FINANCIAL_SOURCE_COMMIT}"
            echo "buildSourceCommit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "stockAbcSha256=${EXPECT_STOCK_ABC_SHA256}"
          } | tee image-meta/BUILD_IDENTITY.txt
          cat "$summarize"

      - name: Upload image metadata (small)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-accept-image-meta-${{ env.STAMP }}
          path: |
            runner-proof.txt
            financial-ancestor.txt
            image-meta/
            smoke-logs/
            job-logs/
            DOCKER_BUILD_*.txt
            docs/fin-accept/STOCK_ABC_V6_INTEGRATION.md
            scripts/fin_accept/seed_controlled_jobs.sql
          if-no-files-found: error

      - name: Upload image tarballs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-accept-image-tarballs-${{ env.STAMP }}
          path: |
            image-tarballs/
          if-no-files-found: error
          retention-days: 14
