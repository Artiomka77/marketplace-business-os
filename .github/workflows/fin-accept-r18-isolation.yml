name: fin-accept-r18-isolation

on:
  push:
    branches:
      - "build/fin-accept-images-20261028_R18"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fin-accept-r18-isolation
  cancel-in-progress: true

jobs:
  isolated-sequence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finaccept
          POSTGRES_PASSWORD: finaccept
          POSTGRES_DB: finaccept
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finaccept -d finaccept"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://finaccept:finaccept@127.0.0.1:5432/finaccept
      WAVE_B_PROFIT_TARGET_DATABASE_URL: postgresql://finaccept:finaccept@127.0.0.1:5432/finaccept
      V6_READMODEL_TARGET_DATABASE_URL: postgresql://finaccept:finaccept@127.0.0.1:5432/finaccept
      WAVE_B_TARGET_DB_MODE: SAME_PRODUCTION_DB
      WEEKLY_REQUIRE_SAME_TARGETS: "1"
      PRIMARY_STAND_DISPOSABLE_OK: "1"
      R18_ISOLATION_OUT: ${{ github.workspace }}/R18_isolation_out
      PRIMARY_C01_ROOT: ${{ github.workspace }}/scripts/fin_accept/fixtures/primary_c01
      R15_IMAGE_TARBALLS: /tmp/r15_image_tarballs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install deps + prisma generate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prisma generate
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Fetch disposable primary stand (draft release asset; not in public tree)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p scripts/fin_accept/fixtures
          if gh release download fin-close-c01-primary-stand \
              --pattern 'primary_c01.tar.gz' \
              --dir /tmp 2>/tmp/primary_dl.err; then
            tar -xzf /tmp/primary_c01.tar.gz -C scripts/fin_accept/fixtures
            test -d scripts/fin_accept/fixtures/primary_c01/normalized_weekly
            echo "PRIMARY_STAND_FETCHED"
            find scripts/fin_accept/fixtures/primary_c01 -type f | wc -l
          else
            echo "PRIMARY_STAND_FETCH_FAILED"
            cat /tmp/primary_dl.err || true
            echo "G3 will be BLOCKED without primary"
          fi
      - name: LF + exec
        run: |
          set -euo pipefail
          sed -i 's/\r$//' scripts/fin_accept/*.sh
          chmod +x scripts/fin_accept/*.sh scripts/fin_accept/*.py || true
      - name: Fetch R15 five-role image tarballs + Telegram NEW/OLD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r15_image_tarballs/image-tarballs
          # Full five-role artifact from accepted R15 image build
          gh run download 40653680208 --repo "${{ github.repository }}" \
            -n fin-accept-image-tarballs-20261028_R15 \
            -D /tmp/r15_image_tarballs
          # Normalize layout to image-tarballs/<role>.tar.gz
          if [[ -d /tmp/r15_image_tarballs/image-tarballs ]]; then
            echo "LAYOUT_OK image-tarballs"
          else
            mkdir -p /tmp/r15_image_tarballs/image-tarballs
            for role in app profit v6 dashboard stock; do
              f="$(find /tmp/r15_image_tarballs -name "${role}.tar.gz" | head -1 || true)"
              [[ -n "$f" ]] && cp -f "$f" "/tmp/r15_image_tarballs/image-tarballs/${role}.tar.gz"
            done
          fi
          for role in app profit v6 dashboard stock; do
            test -f "/tmp/r15_image_tarballs/image-tarballs/${role}.tar.gz" \
              || test -f "/tmp/r15_image_tarballs/${role}.tar.gz"
          done
          # Portable NEW app (accepted Next ImageId 35fe2ecd) — required; do not use
          # artifact image-tarballs/app.tar.gz which may be telegram:c01_new_r15.
          if ! gh release download fin-close-c01-primary-stand \
              --pattern 'app_fin_accept_20261028_R15.tar.gz' \
              --dir /tmp/r15_image_tarballs 2>/tmp/app_tar_dl.err; then
            echo "APP_TAR_RELEASE_MISSING"
            cat /tmp/app_tar_dl.err || true
            exit 2
          fi
          echo "APP_TAR_FROM_RELEASE"
          sha256sum /tmp/r15_image_tarballs/app_fin_accept_20261028_R15.tar.gz
          # Production OLD telegram image (7f9fee6a)
          if gh release download fin-close-c01-primary-stand \
              --pattern 'telegram_old_7f9fee6a.tar.gz' \
              --dir /tmp/r15_image_tarballs 2>/tmp/old_tar_dl.err; then
            echo "OLD_TAR_FROM_RELEASE"
          else
            echo "OLD_TAR_MISSING"
            cat /tmp/old_tar_dl.err || true
            exit 2
          fi
          find /tmp/r15_image_tarballs -name '*.tar.gz' -printf '%p %s\n' | head -40
          echo "TELEGRAM_APP_TAR=/tmp/r15_image_tarballs/app_fin_accept_20261028_R15.tar.gz" >> "$GITHUB_ENV"
          echo "TELEGRAM_OLD_APP_TAR=/tmp/r15_image_tarballs/telegram_old_7f9fee6a.tar.gz" >> "$GITHUB_ENV"
      - name: Run isolated R18/C01 sequence
        env:
          TELEGRAM_APP_TAR: ${{ env.TELEGRAM_APP_TAR }}
          TELEGRAM_OLD_APP_TAR: ${{ env.TELEGRAM_OLD_APP_TAR }}
          TELEGRAM_APP_TAR_SHA256: cdfcbaa72017f5ed82e8659049faa39a0ded4a31d87cadd5989732cf080a5a7a
          R15_IMAGE_TARBALLS: /tmp/r15_image_tarballs
        run: bash scripts/fin_accept/run_isolated_deploy_sequence_R18.sh
      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-accept-r18-isolation-out
          path: R18_isolation_out/
          if-no-files-found: warn
          retention-days: 14
